<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beach volleyball courts — Canton of Zürich</title>
  <meta
    name="description"
    content="An atlas of beach volleyball courts in the Canton of Zürich, sourced from OpenStreetMap."
  />

  <link rel="icon" type="image/x-icon" href="./favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-dark-32.png" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-dark-16.png" media="(prefers-color-scheme: dark)" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <meta name="theme-color" content="#f4efe4" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1b1a17" media="(prefers-color-scheme: dark)" />

  <meta property="og:title" content="Beach volleyball courts — Canton of Zürich" />
  <meta property="og:description" content="An atlas of beach volleyball courts in the Canton of Zürich, sourced from OpenStreetMap." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="./og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <p class="kicker">An atlas of</p>
      <h1 class="title">Beach volleyball courts</h1>
      <p class="dateline">Canton of Zürich · sourced from OpenStreetMap</p>
    </div>
  </header>

  <main class="layout">
    <section class="column-list" aria-label="Court list">
      <div class="controls">
        <label class="search">
          <span class="sr-only">Search courts</span>
          <input
            id="search"
            type="search"
            placeholder="Search by name, city, operator…"
            autocomplete="off"
            spellcheck="false"
          />
        </label>
        <div class="filter-row" role="group" aria-label="Filter by type">
          <button class="chip chip-all" data-filter="all" aria-pressed="true">All</button>
          <button class="chip chip-outdoor" data-filter="outdoor" aria-pressed="false">
            <span class="dot dot-outdoor" aria-hidden="true"></span>Outdoor
          </button>
          <button class="chip chip-indoor" data-filter="indoor" aria-pressed="false">
            <span class="dot dot-indoor" aria-hidden="true"></span>Indoor
          </button>
        </div>
        <div class="canton-row" id="canton-row" role="group" aria-label="Filter by canton"></div>
        <p class="count" id="count" aria-live="polite">Loading…</p>
      </div>
      <ol class="courts" id="courts"></ol>
    </section>

    <section class="column-map" aria-label="Map">
      <div id="map"></div>
    </section>
  </main>

  <footer class="colophon">
    <p>
      Data © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>
      (ODbL 1.0). Tiles by <a href="https://www.openstreetmap.org">OSM</a>.
      Built with <a href="https://leafletjs.com/">Leaflet</a>. Source on
      <a href="https://github.com/Lucanepa/zh-beachvolley">GitHub</a>.
    </p>
  </footer>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="./app.js"></script>
</body>
</html>
